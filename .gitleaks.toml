title = "ChainGuard secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic JWT rotation fixtures; accepted only at the exact test path and exact dummy values."
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''(^|/)ChainGuard/tests/test_jwt_key_rotation\.py$''']
regexes = ['''jwt_secret(?:_previous)?="(?:new|older)-jwt-signing-key-that-is-at-least-32-bytes"''']
