version: "3.9"

services:
  postgres:
    image: postgres:16
    profiles:
      - postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chainguard_prod}
      POSTGRES_USER: ${POSTGRES_USER:-chainguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chainguard_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups/postgres:/backups

  postgres-backup:
    image: postgres:16
    profiles:
      - postgres-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://chainguard:chainguard_secret@postgres:5432/chainguard_prod}
    command: >
      bash -lc 'pg_dump "$$DATABASE_URL" > "/backups/chainguard_$$(date +%Y%m%d_%H%M%S).sql"'
    volumes:
      - ./backups/postgres:/backups

  streamlit:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data

  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data

  api-https:
    build: .
    profiles:
      - https-example
    ports:
      - "8443:8443"
    command: >
      uvicorn src.api:app
      --host 0.0.0.0
      --port 8443
      --ssl-keyfile /certs/dev.key
      --ssl-certfile /certs/dev.crt
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./certs:/certs:ro

volumes:
  pgdata:
