# Ruff 配置落成文件，而不是写在 CI 命令行里——此前 --ignore 只存在于
# .github/workflows/ci.yml，本地 `ruff check` 与 CI 的判定标准不一致。
#
# 默认规则集是 E4/E7/E9 + F。这里不额外 select：真正要拦的是 F 类
# （未使用导入、重定义、未定义名字），它们指向真实缺陷；E5 行长在默认集之外，
# 本仓库大量单行风格代码因此不受影响。

[lint]
# E701/E702：旧决策引擎（src/ 下 webapi 之外的模块）与部分测试沿用历史单行风格，
#            属既定风格选择，不在本仓库的检查范围内。
# E741：`l` 作为推导式变量出现在既有测试里，纯命名偏好，改动收益低于误伤风险。
ignore = ["E701", "E702", "E741"]
