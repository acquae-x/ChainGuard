[pytest]
# 保证直接执行 `pytest tests/ -q` 与 `python -m pytest` 使用同一项目根导入路径。
pythonpath = .
# 只收集正式测试目录，避免把 output/test_tmp 等运行态目录误当成测试包。
testpaths = tests
# OCR/导入测试会在 tests 下生成运行态目录；它们不是测试包，也不应参与收集。
norecursedirs = _runtime_tmp
# 将 pytest 临时目录（tmp_path / tmp_path_factory）重定位到项目内，
# 规避系统 %LOCALAPPDATA%\Temp\pytest-of-<user> 目录权限损坏导致的 WinError 5。
addopts = --basetemp=test_tmp/pytest
