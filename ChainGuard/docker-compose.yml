services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    logging: &json-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m src.webapi.seed"]
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?请在 .env 设置 POSTGRES_USER}:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?请在 .env 设置 POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?请在 .env 设置 SEED_DEMO_PASSWORD}
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *json-logging

  api:
    build:
      context: .
    # --proxy-headers：信任 nginx 注入的 X-Forwarded-For，使限流按真实客户端 IP 计数、审计记录真实 IP
    # （否则所有浏览器流量在后端看来都来自 nginx 容器 IP，全体用户共享同一登录限流桶）
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-4}", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      # /app/data 在容器内有审计/经验卡 jsonl 写入,挂命名卷保持可写并持久化
      - appdata:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    logging: *json-logging

  web:
    build:
      context: ../chainguard-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *json-logging

  postgres-backup:
    build:
      context: .
      dockerfile: scripts/postgres-backup.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups/postgres:/backups
      - appdata:/appdata:ro
    restart: unless-stopped
    logging: *json-logging

volumes:
  pgdata:
  appdata:
