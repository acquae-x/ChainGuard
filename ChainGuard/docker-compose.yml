services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 1.0
    logging: &json-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped

  # 限流计数桶的共享存储。api 默认 --workers 4，进程内计数会把限流额度放大 4 倍
  # （见 src/webapi/limits.py 模块注释），因此 Redis 属于安全依赖而非可选加速。
  redis:
    image: redis:7-alpine
    # appendonly everysec：计数桶允许丢最后一秒，但整段丢失会让重启后出现一个
    # 完全不限流的窗口。
    # maxmemory + allkeys-lru 是取舍后的选择：计数键都自带 TTL，256mb 可容纳百万级
    # 键，正常状态远达不到上限；真到了上限，淘汰旧计数（限流短暂放宽）优于
    # noeviction 下写入报错把整个 API 打成 500。
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redisdata:/data
    mem_limit: 512m
    cpus: 0.5
    logging: *json-logging
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ["/bin/sh", "-c", "alembic upgrade head && python -m src.webapi.seed"]
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?请在 .env 设置 POSTGRES_USER}:${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?请在 .env 设置 POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?请在 .env 设置 SEED_DEMO_PASSWORD}
      # 未设置时 src/webapi/limits.py 会因"非 SQLite 后端 + 无共享存储"拒绝启动，
      # 这是刻意的：多 worker 下静默退回进程内存等同于关掉限流。
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
      # 启动期判死遗留 pending/running 作业的阈值，须显著大于决策作业 60s 的执行超时预算。
      JOB_RECOVERY_STALE_MINUTES: ${JOB_RECOVERY_STALE_MINUTES:-15}
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *json-logging

  api:
    build:
      context: .
    # --proxy-headers：信任 nginx 注入的 X-Forwarded-For，使限流按真实客户端 IP 计数、审计记录真实 IP
    # （否则所有浏览器流量在后端看来都来自 nginx 容器 IP，全体用户共享同一登录限流桶）
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-4}", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      # /app/data 在容器内有审计/经验卡 jsonl 写入,挂命名卷保持可写并持久化
      - appdata:/app/data
      # /app/.workspace 存租户校准注册表（calibration_registry/<digest>/model_registry.json）
      # 与导入暂存（imports/）。它是镜像层里的目录,不挂卷则每次容器重建都随镜像层
      # 一起消失——所有租户的校准基线与漂移历史会静默清零,且因为代码会自动重建空
      # 注册表,故障形态是"漂移检测悄悄从零开始"而不是报错。
      - workspace:/app/.workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    logging: *json-logging

  web:
    build:
      context: ../chainguard-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    logging: *json-logging

  postgres-backup:
    build:
      context: .
      dockerfile: scripts/postgres-backup.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups/postgres:/backups
      - appdata:/appdata:ro
      # 校准基线与 appdata 同属"丢了不可重建"的业务状态,备份范围必须一致
      - workspace:/workspace:ro
    restart: unless-stopped
    logging: *json-logging

  # Explicit profile prevents normal `docker compose up` from running recovery.
  postgres-restore:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: scripts/postgres-backup.Dockerfile
    entrypoint: ["/usr/local/bin/restore-postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env 设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups/postgres:/backups:ro
    restart: "no"
    logging: *json-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${CHAINGUARD_METRICS_TOKEN_FILE:-./secrets/prometheus.jwt}:/run/secrets/chainguard_metrics_token:ro
    ports:
      - "9090:9090"
    logging: *json-logging

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    logging: *json-logging

  node-exporter:
    image: prom/node-exporter:v1.8.1
    profiles: ["monitoring"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    logging: *json-logging

volumes:
  pgdata:
  appdata:
  # 租户校准注册表与导入暂存；见 api 服务上的挂载注释。
  workspace:
  # 限流计数桶的 AOF 落盘。
  redisdata:
