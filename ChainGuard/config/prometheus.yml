global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: chainguard
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/chainguard_metrics_token
    static_configs:
      - targets: [api:8000]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
