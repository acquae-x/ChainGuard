name: ChainGuard CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChainGuard
    env:
      JWT_SECRET: ci-only-signing-key-not-for-deployment
      SEED_DEMO_PASSWORD: ci-demo-password
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # 旧决策引擎保留历史单行风格；本阶段对 Web API 和其契约测试执行 Ruff。
      - run: ruff check src/webapi tests/test_webapi.py --ignore E701,E702
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chainguard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chainguard-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
