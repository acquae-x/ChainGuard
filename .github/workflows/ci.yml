name: ChainGuard CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChainGuard
    env:
      JWT_SECRET: ci-only-signing-key-not-for-deployment
      SEED_DEMO_PASSWORD: ci-demo-password
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # 旧决策引擎保留历史单行风格；本阶段对 Web API 和其契约测试执行 Ruff。
      - run: ruff check src/webapi tests/test_webapi.py --ignore E701,E702
      - run: alembic upgrade head
      # pytest.ini 配置 --basetemp=.tmp/pytest，pytest 不自动创建父目录（本地长期存在该目录掩盖了此问题）
      - run: mkdir -p .tmp/pytest
      # 演示企业库 *.db 不入库（.gitignore 排除），场景/监控/校准类测试依赖它，CI 现场确定性生成（固定 SEED）
      - run: python scripts/generate_enterprise_demo_data.py
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chainguard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chainguard-web/package-lock.json
      - run: npm ci
      # 生成 src/.umi 类型声明（@/ 别名、useAccess 等），tsc 依赖它；本地有构建残留掩盖了此问题
      - run: npx max setup
      - run: npx tsc --noEmit
      - run: npm run build
