openapi: 3.0.3
info:
  title: ChainGuard Synthetic ERP API
  version: 1.0.0
  description: 合成企业数据接口，仅用于演示和联调。
servers:
  - url: http://127.0.0.1:8765
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200': {description: 服务正常}
  /api/v1/catalog:
    get:
      summary: 获取资源目录与记录数
      responses:
        '200': {description: 成功}
