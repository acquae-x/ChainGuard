      summary: 获取供应链驾驶舱摘要
      responses:
        '200': {description: 成功}
  /api/v1/materials:
    get:
      summary: 分页查询 materials
      parameters:
        - in: query
          name: page
          schema: {type: integer, default: 1, minimum: 1}
        - in: query
          name: page_size
          schema: {type: integer, default: 100, minimum: 1, maximum: 1000}
      responses:
        '200': {description: 成功}

